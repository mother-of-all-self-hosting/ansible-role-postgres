---
- name: Verify Postgres systemd service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Verify that Postgres works
      block:
    - name: Wait for the Postgres systemd service to become active (up to 180s)
      ansible.builtin.systemd_service:
        name: postgres.service
      register: postgres_service
      until: postgres_service.status.ActiveState == 'active'
      retries: 36
      delay: 5
      # So that giving up is reported by the assertion below rather than as a
      # wall of systemd unit properties.
      failed_when: false

    # `Restart=always` in the systemd unit means that even a container which crashes
    # and gets restarted reads as active here, so this is a precondition rather than
    # a result.
    - name: Assert the Postgres systemd service is active
      ansible.builtin.assert:
        that: postgres_service.status.ActiveState == 'active'
        fail_msg: "postgres.service is not active ({{ postgres_service.status.ActiveState }})"
        success_msg: "postgres.service is active"

    - name: Retrieve the Postgres systemd service log for debugging
      when: postgres_debug_service_enabled | bool
      ansible.builtin.command:
        cmd: journalctl --no-pager --output=cat --unit=postgres.service
      changed_when: false

    - name: Show the Postgres verification summary
      ansible.builtin.debug:
        msg:
          - "Postgres systemd: {{ postgres_service.status.ActiveState }}"

      rescue:
        # Whatever went wrong, the reason is almost always in the systemd service log.
        - name: Retrieve the Postgres systemd service log
          ansible.builtin.command:
            cmd: journalctl --no-pager --output=cat --unit=postgres.service
          register: postgres_service_log
          changed_when: false

        - name: Show the Postgres systemd service log
          ansible.builtin.debug:
            var: postgres_service_log.stdout_lines

        - name: Fail because verification did not pass
          ansible.builtin.fail:
            msg: "Postgres verification failed. The systemd service log is printed above."
